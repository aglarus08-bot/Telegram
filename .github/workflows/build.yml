name: Build APK

on:
  workflow_dispatch:   # запуск кнопкой "Run workflow" во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Скачать код (вместе с подмодулями)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Поставить SDK, NDK и CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Подогнать google-services.json под ваш applicationId
        run: |
          APP_ID="com.vg123.messenger"   # тот же, что в rebrand.py
          find . -name google-services.json -not -path "*/build/*" \
            -exec sed -i "s/org\.telegram\.messenger/${APP_ID}/g" {} +

      - name: Собрать APK
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-apk
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
